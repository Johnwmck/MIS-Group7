<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Team 7 Books</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
        </div>
    </nav>

    <main class="container my-4">
        <div class="page-header">
            <div>
                <span class="page-eyebrow">Secure Prototype Checkout</span>
                <h1>Checkout</h1>
            </div>

            <a class="btn btn-outline-primary" id="checkoutBackLink" href="index.html">
                Back
            </a>
        </div>

        <div id="checkoutMessage" class="alert alert-warning d-none" role="alert"></div>

        <div id="checkoutContent" class="row g-4 d-none">
            <section class="col-lg-7">
                <div class="card">
                    <div class="card-header">Customer Information</div>

                    <div class="card-body">
                        <form id="checkoutForm">
                            <div class="mb-3">
                                <label class="form-label" for="customerName">
                                    Name
                                </label>
                                <input type="text" class="form-control" id="customerName" autocomplete="name" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="customerEmail">
                                    Email
                                </label>
                                <input type="email" class="form-control" id="customerEmail" autocomplete="email"
                                    required>
                            </div>

                            <p class="text-muted small">
                                This prototype does not collect payment information.
                            </p>

                            <button type="submit" class="btn btn-primary" id="placeOrderButton">
                                Place Order
                            </button>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-lg-5">
                <div class="card">
                    <div class="card-header">Order Summary</div>

                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th scope="col">Book</th>
                                        <th scope="col">Qty.</th>
                                        <th scope="col">Price</th>
                                        <th scope="col">Subtotal</th>
                                    </tr>
                                </thead>

                                <tbody id="checkoutItems"></tbody>
                            </table>
                        </div>

                        <p class="fs-5 fw-bold text-end mb-0" id="checkoutTotal"></p>
                    </div>
                </div>
            </section>
        </div>

        <section id="orderConfirmation" class="card d-none">
            <div class="card-header">Order Confirmed</div>

            <div class="card-body">
                <h2 class="h4">Thank you, <span id="confirmationCustomerName"></span>!</h2>
                <p>Your order was placed successfully.</p>
                <p>
                    <strong>Order ID:</strong>
                    <span id="confirmationOrderId"></span>
                </p>
                <p>
                    <strong>Total:</strong>
                    <span id="confirmationTotal"></span>
                </p>

                <a class="btn btn-primary" href="index.html">Continue Shopping</a>
            </div>
        </section>
    </main>

    <script src="scripts/data.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/checkout.js"></script>
</body>

</html>
