<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7 Books - Internal Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card">
                    <div class="card-body p-4">
                        <span class="page-eyebrow">Internal Tool</span>
                        <h1 class="h2 mb-3">Internal Login</h1>

                        <p class="text-muted">
                            Sign in with a demonstration Employee or Admin
                            account.
                        </p>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label" for="usernameInput">
                                    Username
                                </label>
                                <input type="text" class="form-control" id="usernameInput" autocomplete="username"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="passwordInput">
                                    Password
                                </label>
                                <input type="password" class="form-control" id="passwordInput"
                                    autocomplete="current-password" required>
                            </div>

                            <p class="alert alert-danger d-none" id="loginError" role="alert"></p>

                            <button type="submit" class="btn btn-primary w-100">
                                Sign In
                            </button>
                        </form>

                        <div class="mt-4 small text-muted">
                            <p class="mb-1">
                                Admin demo: <code>admin</code> /
                                <code>admin123</code>
                            </p>
                            <p class="mb-0">
                                Employee demo: <code>employee</code> /
                                <code>employee123</code>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="scripts/data.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/login.js"></script>
</body>

</html>
