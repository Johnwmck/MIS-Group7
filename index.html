<html>

<head>
    <title>Team 7 Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <h1 class="text-center">Bookstore</h1>

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Team 7 Books</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="employee.html">Employee Portal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin Portal</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-lg-9">
                <div class="input-group mb-3">
                    <select class="form-select" id="searchFieldSelect" style="max-width: 140px;">
                        <option value="title" selected>Title</option>
                        <option value="author">Author</option>
                        <option value="genre">Genre</option>
                    </select>
                    <input type="search" class="form-control" id="searchInput" placeholder="Search...">
                </div>
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3" id="bookContainer">
                </div>
            </div>
            <div class="col-lg-3">
                <div class="card sticky-top" style="top: 1rem;">
                    <div class="card-header">
                        <h5 class="mb-0">Cart</h5>
                    </div>
                    <div class="card-body">
                        <p id="cartEmptyMessage" class="text-muted mb-0">Your cart is empty.</p>
                        <div id="cartItems"></div>
                        <p id="cartTotal" class="fw-bold mt-2 d-none"></p>
                        <button type="button" class="btn btn-primary w-100 d-none" id="checkoutButton">Checkout</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalBookTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="modalBookImage" src="" alt="" class="img-fluid mb-3">
        <p id="modalBookAuthor"></p>
        <p id="modalBookGenre"></p>
        <p id="modalBookPrice"></p>
        <p id="modalBookInventory"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="addToCartButton">Add to Cart</button>
        <button type="button" class="btn btn-success" id="buyNowButton">Buy Now</button>
      </div>
    </div>
  </div>
</div>


    <div class="modal fade" id="checkoutConfirmModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirm Your Order</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div id="checkoutSummaryItems"></div>
                    <p class="fw-bold mt-2 mb-0" id="checkoutSummaryTotal"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-success" id="confirmCheckoutButton">Place Order</button>
                </div>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="cartToastBody"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <button id="resetCatalogButton" class=>Reset Catalog</button> <!-- delete or add "d-none" before >Reset Catalog if you want reset or add button -->

    <script src="scripts/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/customer.js"></script>
</body>

</html>
