<html>

<head>
    <title>Team 7 Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <h1>Bookstore</h1>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Team 7 Books</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="employee.html">Employee Portal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="admin.html">Admin Portal</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
    <div class="row row-cols-1 row-cols-md-3 g-4" id="bookContainer">
    </div>
</div>

    <div class="modal fade" id="bookModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modalBookTitle"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <img id="modalBookImage" src="" alt="" class="img-fluid mb-3">
        <p id="modalBookAuthor"></p>
        <p id="modalBookGenre"></p>
        <p id="modalBookPrice"></p>
        <p id="modalBookInventory"></p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" id="addToCartButton">Add to Cart</button>
        <button type="button" class="btn btn-success" id="buyNowButton">Buy Now</button>
      </div>
    </div>
  </div>
</div>


    <button id="resetCatalogButton">Reset Catalog</button>

    <script src="scripts/data.js"></script>
    <script src="scripts/customer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
