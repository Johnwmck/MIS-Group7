<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - Team 7 Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Team 7 Books</a>
            <a class="nav-link text-white" href="cart.html" aria-current="page">
                Cart (<span id="cartCount">0</span>)
            </a>
        </div>
    </nav>

    <main class="container my-4">
        <div class="page-header">
            <h1>Your Cart</h1>
            <a class="btn btn-outline-primary" href="index.html">Continue Shopping</a>
        </div>

        <div id="cartMessages" class="alert alert-warning d-none" role="status"></div>

        <p id="cartEmptyMessage">Your cart is empty.</p>

        <div id="cartContents" class="d-none">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Book</th>
                            <th scope="col">Price</th>
                            <th scope="col">Quantity</th>
                            <th scope="col">Subtotal</th>
                            <th scope="col">Remove</th>
                        </tr>
                    </thead>
                    <tbody id="cartTableBody"></tbody>
                </table>
            </div>

            <div class="text-end">
                <p id="cartTotal" class="fs-5 fw-bold"></p>
                <button type="button" id="checkoutButton" class="btn btn-primary" disabled>
                    Checkout
                </button>
            </div>
        </div>
    </main>

    <script src="scripts/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/cart.js"></script>
</body>

</html>
