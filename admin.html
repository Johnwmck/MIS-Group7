<html>

<head>
    <title>Team 7 Books - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">Team 7 Books</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="employee.html">Employee Portal</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="admin.html">Admin Portal</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Admin Page</h1>
            <button type="button" class="btn btn-primary" id="addBookButton">Add Book</button>
        </div>

        <input type="search" class="form-control mb-3" id="titleSearchInput" placeholder="Search by title...">

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Genre</th>
                        <th>Price</th>
                        <th>Inventory</th>
                        <th>Status</th>
                        <th>Stock</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>

        <hr class="my-4">

        <h2>Reports</h2>
        <div class="row row-cols-2 row-cols-md-4 g-3 mb-4" id="statsSummaryRow">
        </div>
        <div class="row g-3 mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Low Stock Items</div>
                    <ul class="list-group list-group-flush" id="lowStockList"></ul>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Best-Selling Titles</div>
                    <ul class="list-group list-group-flush" id="bestSellersList"></ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="bookFormModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="bookFormModalTitle">Add Book</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="bookForm">
                        <input type="hidden" id="bookFormId">
                        <div class="mb-2">
                            <label class="form-label" for="bookFormTitle">Title</label>
                            <input type="text" class="form-control" id="bookFormTitle" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="bookFormAuthor">Author</label>
                            <input type="text" class="form-control" id="bookFormAuthor" required>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label" for="bookFormGenre">Genre</label>
                                <input type="text" class="form-control" id="bookFormGenre" required>
                            </div>
                            <div class="col mb-2">
                                <label class="form-label" for="bookFormIsbn">ISBN</label>
                                <input type="text" class="form-control" id="bookFormIsbn" required>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col mb-2">
                                <label class="form-label" for="bookFormPrice">Price</label>
                                <div class="input-group">
                                    <span class="input-group-text">$</span>
                                    <input type="number" min="0" step="0.01" class="form-control" id="bookFormPrice"
                                        required>
                                </div>
                            </div>
                            <div class="col mb-2">
                                <label class="form-label" for="bookFormInventory">Inventory</label>
                                <input type="number" min="0" class="form-control" id="bookFormInventory" required>
                            </div>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="bookFormImage">Image URL</label>
                            <input type="text" class="form-control" id="bookFormImage" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label" for="bookFormStatus">Status</label>
                            <select class="form-select" id="bookFormStatus">
                                <option value="Active">Active</option>
                                <option value="Inactive">Inactive</option>
                            </select>
                        </div>
                        <div class="form-text text-danger d-none" id="bookFormError"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-primary" id="saveBookButton">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="scripts/data.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/admin.js"></script>
</body>

</html>
