<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Favorites - Team 7 Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/base.css?v=split-1">
    <link rel="stylesheet" href="css/layout.css?v=review-1">
    <link rel="stylesheet" href="css/components.css?v=review-2">
    <link rel="stylesheet" href="css/pages.css?v=review-1">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
            <div class="site-primary-nav order-last"><ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Internal Login</a></li>
            </ul></div>
            <a class="nav-link text-white ms-auto me-3" href="favorites.html" aria-current="page">
                <svg class="navbar-heart" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
                </svg>
                <span class="favorites-label">Favorites</span> (<span id="favoritesCount">0</span>)
            </a>
            <div class="cart-menu">
                <a class="nav-link text-white" href="cart.html">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <div class="page-header">
            <h1>Your Favorites</h1>
            <a class="btn btn-outline-primary" href="index.html">Continue Shopping</a>
        </div>

        <div id="favoritesMessages" class="alert alert-warning d-none" role="status"></div>

        <p id="favoritesEmptyMessage">
            You have no favorites yet. Select the heart on any book to save it here.
        </p>

        <div id="favoritesContents" class="d-none">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th scope="col">Book</th>
                            <th scope="col">Price</th>
                            <th scope="col">Availability</th>
                            <th scope="col">Add to Cart</th>
                            <th scope="col">Remove</th>
                        </tr>
                    </thead>
                    <tbody id="favoritesTableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <footer id="siteFooter" class="site-footer mt-auto"></footer>

    <script src="scripts/internal-users.js"></script>
    <script src="scripts/auth.js?v=account-nav-1"></script>
    <script src="scripts/book-utils.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/cart-state.js?v=concurrency-1"></script>
    <script src="scripts/favorites-state.js"></script>
    <script src="scripts/checkout-state.js"></script>
    <script src="scripts/cart-preview.js?v=history-3"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/favorites.js"></script>
    <script src="scripts/site-footer.js?v=review-1"></script>
</body>

</html>
