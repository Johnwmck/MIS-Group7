<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7 Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=catalog-1">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid align-items-center">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>

            <!-- Searching from the home page opens the catalog with the results. -->
            <form class="navbar-search-form order-3 order-lg-2 mx-lg-auto" role="search" action="catalog.html"
                method="get">
                <label class="visually-hidden" for="searchInput">Search by title, author, genre, or ISBN</label>
                <div class="input-group navbar-search-group">
                    <input type="search" class="form-control" id="searchInput" name="search"
                        placeholder="Search by Title, Author, Genre, or ISBN">
                    <button class="btn navbar-search-btn" type="submit" aria-label="Search">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16"
                            fill="currentColor">
                            <path
                                d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
                        </svg>
                    </button>
                </div>
            </form>

            <a class="nav-link text-white order-2 order-lg-3 ms-auto ms-lg-3 me-3" href="favorites.html">
                <svg class="navbar-heart" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
                </svg>
                <span class="favorites-label">Favorites</span> (<span id="favoritesCount">0</span>)
            </a>
            <div class="cart-menu order-2 order-lg-3 me-2 me-lg-3">
                <a class="nav-link text-white" href="cart.html">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>
            <button class="navbar-toggler order-4" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse order-5" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="catalog.html">Catalog</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html">Internal Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="brand-hero text-center">
        <h1>Find your next favorite read</h1>
        <p class="mx-auto">Curated fiction, nonfiction, and everything between.</p>
        <div class="accent-rule"></div>
        <a class="btn btn-light mt-4" href="catalog.html">Browse the Full Catalog</a>
    </div>

    <div class="container">
        <p id="homeLoadMessage" class="alert alert-info d-none" role="status"></p>

        <section class="mb-4" aria-labelledby="bestSellersHeading">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <div>
                    <h2 class="h3 mb-0" id="bestSellersHeading">Best Sellers</h2>
                    <span class="text-muted small">Based on copies sold</span>
                </div>

                <div class="d-none" id="bestSellersControls">
                    <button type="button" class="btn btn-outline-primary carousel-step"
                        data-bs-target="#bestSellersCarousel" data-bs-slide="prev"
                        aria-label="Previous best sellers">
                        &lsaquo;
                    </button>
                    <button type="button" class="btn btn-outline-primary carousel-step"
                        data-bs-target="#bestSellersCarousel" data-bs-slide="next" aria-label="Next best sellers">
                        &rsaquo;
                    </button>
                </div>
            </div>

            <div id="bestSellersCarousel" class="carousel slide book-row-carousel d-none" data-bs-interval="false"
                aria-label="Best sellers">
                <div class="carousel-inner book-grid" id="customerBestSellers"></div>
            </div>

            <p class="text-muted mb-0" id="customerBestSellersEmpty">
                Best sellers will appear after customers place orders.
            </p>
        </section>

        <div id="genreRows"></div>

        <div class="text-center my-4">
            <a class="btn btn-primary" href="catalog.html">Browse the Full Catalog</a>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="cartToastBody"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="scripts/book-utils.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/cart-state.js?v=concurrency-1"></script>
    <script src="scripts/favorites-state.js"></script>
    <script src="scripts/checkout-state.js"></script>
    <script src="scripts/cart-preview.js?v=cart-preview-4"></script>
    <script src="scripts/reporting.js?v=home-1"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/book-cards.js"></script>
    <script src="scripts/home.js"></script>
</body>

</html>
