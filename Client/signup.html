<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7 Books - Create an Account</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css?v=split-1">
    <link rel="stylesheet" href="css/layout.css?v=review-1">
    <link rel="stylesheet" href="css/components.css?v=review-2">
    <link rel="stylesheet" href="css/pages.css?v=review-1">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
            <div class="site-primary-nav order-last"><ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
                <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            </ul></div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card">
                    <div class="card-body p-4">
                        <h1 class="h2 mb-3">Create an Account</h1>

                        <form id="signupForm">
                            <div class="row g-3 mb-3">
                                <div class="col-sm-6">
                                    <label class="form-label" for="firstNameInput">First name</label>
                                    <input type="text" class="form-control" id="firstNameInput"
                                        autocomplete="given-name" maxlength="50" required>
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="lastNameInput">Last name</label>
                                    <input type="text" class="form-control" id="lastNameInput"
                                        autocomplete="family-name" maxlength="50" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="emailInput">Email</label>
                                <input type="email" class="form-control" id="emailInput"
                                    autocomplete="email" maxlength="254" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="phoneInput">
                                    Phone number <span class="text-muted">(optional)</span>
                                </label>
                                <input type="tel" class="form-control" id="phoneInput"
                                    autocomplete="tel" maxlength="25">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="passwordInput">Password</label>
                                <input type="password" class="form-control" id="passwordInput"
                                    autocomplete="new-password" minlength="8" maxlength="128"
                                    aria-describedby="passwordHelp" required>
                                <div class="form-text" id="passwordHelp">At least 8 characters.</div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="confirmPasswordInput">Confirm password</label>
                                <input type="password" class="form-control" id="confirmPasswordInput"
                                    autocomplete="new-password" minlength="8" maxlength="128" required>
                            </div>

                            <p class="alert alert-danger d-none" id="signupError" role="alert"></p>

                            <button type="submit" class="btn btn-primary w-100" id="signupButton">
                                Create Account
                            </button>
                        </form>

                        <p class="text-center mt-3 mb-0">
                            Already have an account? <a href="login.html">Log in</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="siteFooter" class="site-footer mt-auto"></footer>

    <script src="scripts/internal-users.js"></script>
    <script src="scripts/customer-accounts.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/auth.js?v=account-nav-1"></script>
    <script src="scripts/signup.js"></script>
    <script src="scripts/site-footer.js?v=review-1"></script>
</body>

</html>
