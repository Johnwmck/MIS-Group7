<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Details - Team 7 Books</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=home-1">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
            <a class="nav-link text-white ms-auto me-3" href="favorites.html">
                <svg class="navbar-heart" xmlns="http://www.w3.org/2000/svg" width="16" height="16"
                    viewBox="0 0 16 16" aria-hidden="true">
                    <path d="M8 1.314C12.438-3.248 23.534 4.735 8 15-7.534 4.736 3.562-3.248 8 1.314" />
                </svg>
                <span class="favorites-label">Favorites</span> (<span id="favoritesCount">0</span>)
            </a>
            <div class="cart-menu">
                <a class="nav-link text-white" href="cart.html">
                    Cart (<span id="cartCount">0</span>)
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-4">
        <a class="btn btn-outline-primary btn-sm mb-3" href="index.html">Continue Shopping</a>

        <p id="bookMessage" class="alert alert-info d-none" role="status"></p>

        <div id="bookContent" class="d-none">
            <div class="row g-4 mb-4">
                <div class="col-md-5">
                    <div id="bookCarousel" class="carousel slide carousel-dark card book-carousel"
                        data-bs-interval="false" aria-label="Cover and summary">
                        <div class="carousel-inner">
                            <div class="carousel-item active">
                                <div class="book-slide">
                                    <img id="bookCover" class="book-cover" src="" alt="">
                                </div>
                            </div>

                            <div class="carousel-item">
                                <div class="book-slide">
                                    <h2 class="h4">Summary</h2>
                                    <p class="mb-0" id="bookDescription"></p>
                                </div>
                            </div>
                        </div>

                        <button class="carousel-control-prev" type="button" data-bs-target="#bookCarousel"
                            data-bs-slide="prev">
                            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Previous</span>
                        </button>
                        <button class="carousel-control-next" type="button" data-bs-target="#bookCarousel"
                            data-bs-slide="next">
                            <span class="carousel-control-next-icon" aria-hidden="true"></span>
                            <span class="visually-hidden">Next</span>
                        </button>
                    </div>
                </div>

                <div class="col-md-7">
                    <span class="page-eyebrow" id="bookGenre"></span>
                    <h1 id="bookTitle"></h1>
                    <p class="text-muted" id="bookByline"></p>

                    <section class="card" aria-label="Purchase options">
                        <div class="card-body">
                            <div class="fs-3 fw-bold" id="bookPrice"></div>
                            <div class="mb-3" id="bookAvailability"></div>

                            <div class="d-flex flex-wrap align-items-end gap-3">
                                <div>
                                    <label class="form-label" for="bookQuantity">Quantity</label>
                                    <input type="number" class="form-control book-quantity" id="bookQuantity"
                                        min="1" step="1" value="1">
                                </div>

                                <button type="button" class="btn btn-primary" id="addToCartButton">
                                    Add to Cart
                                </button>
                                <div id="bookFavoriteSlot"></div>
                                <button type="button" class="btn btn-success" id="buyNowButton">Buy Now</button>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

            <section aria-labelledby="similarBooksHeading">
                <h2 class="h3" id="similarBooksHeading">Similar Books</h2>

                <p class="text-muted d-none" id="similarBooksEmpty">
                    No similar books are available right now.
                </p>

                <div class="row row-cols-2 row-cols-md-4 g-3 book-grid" id="similarBooks"></div>
            </section>
        </div>
    </main>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="cartToast" class="toast align-items-center border-0" role="alert" aria-live="assertive"
            aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="cartToastBody"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
            </div>
        </div>
    </div>

    <script src="scripts/book-utils.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/cart-state.js?v=concurrency-1"></script>
    <script src="scripts/favorites-state.js"></script>
    <script src="scripts/cart-preview.js?v=cart-preview-4"></script>
    <script src="scripts/checkout-state.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/book.js?v=book-page-5"></script>
</body>

</html>
