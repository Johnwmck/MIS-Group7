<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7 Books - Employee</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="employee.html">
                            Employee Portal
                        </a>
                    </li>

                    <li class="nav-item" id="adminNavItem">
                        <a class="nav-link" href="admin.html">Admin Portal</a>
                    </li>

                    <li class="nav-item">
                        <span class="nav-link" id="currentInternalUser"></span>
                    </li>

                    <li class="nav-item">
                        <button type="button" class="btn btn-link nav-link" id="logoutButton">
                            Logout
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="page-header">
            <div>
                <span class="page-eyebrow">Internal Tool</span>
                <h1>Employee Portal</h1>
            </div>
        </div>

        <p class="alert alert-info">
            Inventory now uses the API catalog. Order history still uses this
            browser's demo orders during migration.
        </p>

        <p id="inventoryMessage" class="alert d-none" role="status"></p>

        <input type="search" class="form-control mb-3" id="titleSearchInput" placeholder="Search by title...">

        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                    <tr>
                        <th>Cover</th>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Inventory</th>
                        <th>Stock Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                </tbody>
            </table>
        </div>

        <hr class="my-4">

        <section aria-labelledby="orderHistoryHeading">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <span class="page-eyebrow">Customer Service</span>
                    <h2 id="orderHistoryHeading">Order History</h2>
                </div>

                <button type="button" class="btn btn-outline-primary" id="orderExportButton">
                    Export CSV
                </button>
            </div>
            <label class="visually-hidden" for="orderSearchInput">
                Search order history
            </label>
            <input type="search" class="form-control mb-3" id="orderSearchInput"
                placeholder="Search by order ID, customer, email, or book title...">

            <p class="text-muted" id="orderHistoryEmpty">
                No completed orders are available.
            </p>
            <div id="orderHistoryList"></div>
        </section>

    </div>

    <script src="scripts/data.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/auth.js"></script>
    <script>
        initializeInternalAccess('Employee');
    </script>
    <script src="scripts/order-history.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/employee.js"></script>

</body>

</html>
