<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team 7 Books - Internal Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/base.css?v=split-1">
    <link rel="stylesheet" href="css/layout.css?v=review-1">
    <link rel="stylesheet" href="css/components.css?v=review-2">
    <link rel="stylesheet" href="css/pages.css?v=review-1">
</head>

<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-dark site-navbar">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <img src="images/logo.jpg" alt="Team 7 Books" class="navbar-logo">
            </a>
            <div class="site-primary-nav order-last"><ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="catalog.html">Catalog</a></li>
                <li class="nav-item"><a class="nav-link active" aria-current="page" href="login.html">Internal Login</a></li>
                <li class="nav-item"><a class="nav-link" href="favorites.html">Favorites</a></li>
                <li class="nav-item"><a class="nav-link" href="cart.html">Cart</a></li>
            </ul></div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="card">
                    <div class="card-body p-4">
                        <span class="page-eyebrow">Internal Tool</span>
                        <h1 class="h2 mb-3">Internal Login</h1>

                        <p class="text-muted">
                            Sign in with a demonstration Employee or Admin
                            account.
                        </p>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label" for="usernameInput">
                                    Username
                                </label>
                                <input type="text" class="form-control" id="usernameInput" autocomplete="username"
                                    required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="passwordInput">
                                    Password
                                </label>
                                <input type="password" class="form-control" id="passwordInput"
                                    autocomplete="current-password" required>
                            </div>

                            <p class="alert alert-danger d-none" id="loginError" role="alert"></p>

                            <button type="submit" class="btn btn-primary w-100">
                                Sign In
                            </button>
                        </form>

                        <div class="mt-4 small text-muted">
                            <p class="mb-1">
                                Admin demo: <code>admin</code> /
                                <code>admin123</code>
                            </p>
                            <p class="mb-0">
                                Employee demo: <code>employee</code> /
                                <code>employee123</code>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer id="siteFooter" class="site-footer mt-auto"></footer>

    <script src="scripts/internal-users.js"></script>
    <script src="scripts/navbar-scroll.js"></script>
    <script src="scripts/auth.js?v=account-nav-1"></script>
    <script src="scripts/login.js"></script>
    <script src="scripts/site-footer.js?v=review-1"></script>
</body>

</html>
